<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style/app.css" />
    <title>Frontend Mentor | Calculator app</title>
    <script defer src="./js/app.js" type="module"></script>
  </head>
  <body>
    <section class="header-app">
      <div class="container">
        <div class="header-app__wraper">
          <div class="header-app__title">
            <h1>calc</h1>
          </div>
          <div class="theme">
            <div class="theme__text">
              <p>theme</p>
            </div>
            <div class="theme__btn">
              <div class="theme__btn-top">
                <p>1</p>
                <p>2</p>
                <p>3</p>
              </div>
              <div class="theme__btn-bottom"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="show-nums">
      <div class="container">
        <div class="show-nums__wraper">
          <input type="text" id="showNums" class="show-nums__input" />
        </div>
      </div>
    </section>
    <section class="btns-app">
      <div class="container">
        <div class="btns-app__wraper">
          <div class="btns-app__btn number" data-value="7">
            <p>7</p>
          </div>
          <div class="btns-app__btn number" data-value="8">
            <p>8</p>
          </div>
          <div class="btns-app__btn number" data-value="9">
            <p>9</p>
          </div>
          <div class="btns-app__btn delete" data-value="del">
            <p>del</p>
          </div>
          <div class="btns-app__btn number" data-value="4">
            <p>4</p>
          </div>
          <div class="btns-app__btn number" data-value="5">
            <p>5</p>
          </div>
          <div class="btns-app__btn number" data-value="6">
            <p>6</p>
          </div>
          <div class="btns-app__btn number" data-value="+">
            <p>+</p>
          </div>
          <div class="btns-app__btn number" data-value="1">
            <p>1</p>
          </div>
          <div class="btns-app__btn number" data-value="2">
            <p>2</p>
          </div>
          <div class="btns-app__btn number" data-value="3">
            <p>3</p>
          </div>
          <div class="btns-app__btn number" data-value="-">
            <p>-</p>
          </div>
          <div class="btns-app__btn number" data-value=".">
            <p>.</p>
          </div>
          <div class="btns-app__btn number" data-value="0">
            <p>0</p>
          </div>
          <div class="btns-app__btn number" data-value="/">
            <p>/</p>
          </div>
          <div class="btns-app__btn number" data-value="x">
            <p>x</p>
          </div>
          <div class="btns-app__btn reset" data-value="reset">
            <p>reset</p>
          </div>
          <div class="btns-app__btn equal" data-value="=">
            <p>=</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
